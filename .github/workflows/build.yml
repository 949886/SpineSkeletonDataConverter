name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build tools
        run: cmake --build build --config Release --target SpineSkeletonDataConverter SpineAtlasDowngrade --parallel

      - name: Upload Linux binaries
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SpineSkeletonDataConverter-linux
          if-no-files-found: error
          path: |
            build/SpineSkeletonDataConverter
            build/SpineAtlasDowngrade

      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SpineSkeletonDataConverter-windows
          if-no-files-found: error
          path: |
            build/Release/SpineSkeletonDataConverter.exe
            build/Release/SpineAtlasDowngrade.exe
